# ==============================================================================
# PROYECTO: MVP WEB SEGALU (Arquitectura Todo en Uno - FastAPI + Frontend)
# ARCHIVO: render.yaml (Configuración de despliegue en Render.com)
# ==============================================================================
services:
  - type: web
    name: segalu-pantalla
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1 --no-access-log --limit-concurrency 100
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONMALLOC
        value: malloc
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: multimedia_segalu
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
